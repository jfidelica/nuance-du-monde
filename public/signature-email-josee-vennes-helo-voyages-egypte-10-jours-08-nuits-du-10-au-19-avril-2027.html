<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Signature email - Josée Vennes - Helo Voyages - Égypte - 10 jours 08 nuits - Du 10 au 19 Avril 2027</title>
    <style>
        body {
            font-family: Outfit, sans-serif;
        }
        #copyButton {
            margin: 15px auto;
            display: block;
            padding: 10px 15px;
            background-color: #0c86b7;
            color: #FFFFFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }
        #copyButton:hover {
            background-color: #222222;
        }
    </style>
</head>
<body>
    <!-- Bouton Copier -->
    <button id="copyButton">Copier la signature</button>

    <!-- Début de la signature -->
    <table id="signature" style="font-family: Outfit, sans-serif; color: #222222; width: 100%; max-width: 600px; border-collapse: collapse; border-top: 1px solid #121212; padding-top: 15px;">
        <tr>
            <td style="padding: 10px;">
                <!-- Bannière promotionnelle -->
                <a href="https://helovoyages.com/contact/" target="_blank">
                    <img src="https://nuancedumonde.com/uploads/signature-email-josee-vennes-helo-voyages-egypte-10-jours-08-nuits-du-10-au-19-avril-2027.gif" alt="Bannière signature" style="width: 100%; max-width: 600px; display: block; margin: 15px auto 0; border-radius: 8px;">
                </a>

                <!-- Texte de fin -->
                <p style="font-size: 12px; color: #131312; text-align: center; line-height: 1.5; padding-top: 15px; margin-top: 20px; max-width: 600px;">
                    © 2026 Helo Voyages est une agence détentrice d’un permis du Québec (permis numéro 703369)<br>
					et encadrée par l’Office de la protection du consommateur du Québec.
                </p>
            </td>
        </tr>
    </table>

    <script>
        document.getElementById('copyButton').addEventListener('click', function() {
            var signature = document.getElementById('signature');
            var range = document.createRange();
            range.selectNode(signature);
            var selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            try {
                document.execCommand('copy');
                alert('Signature copiée avec succès !');
            } catch (e) {
                alert('Impossible de copier la signature. Veuillez essayer manuellement.');
            }
            selection.removeAllRanges();
        });
    </script>
</body>
</html>
